name: Build
on:
    push:
        branches: [main]
        tags: ["v*"]
    pull_request:
        branches: [main]

jobs:
    build-and-test:
        runs-on: ubuntu-24.04
        container:
            image: gcc@sha256:47c649664b62db94d186b16936e203bb07ab1d10a0ef860cee198e594f636757
        steps:
            - name: Install CMake
              run: |
                  apt update
                  apt install -y wget tar ninja-build python3

                  wget https://github.com/Kitware/CMake/releases/download/v4.3.3/cmake-4.3.3-linux-x86_64.tar.gz

                  tar -xzf cmake-4.3.3-linux-x86_64.tar.gz -C /opt

                  ln -s /opt/cmake-4.3.3-linux-x86_64/bin/* /usr/local/bin/

            - name: Checkout Project
              uses: actions/checkout@v6.0.3

            - name: Build Project
              uses: threeal/cmake-action@v2.1.0
              with:
                  build-dir: build
                  generator: Ninja
                  c-compiler: gcc
                  cxx-compiler: g++
                  options: |
                      BUILD_TESTS=ON
                      BUILD_EXAMPLES=ON
                      CMAKE_BUILD_TYPE=Release

            - name: Test Project
              uses: threeal/ctest-action@v1.1.0

            - name: Verify installation and FetchContent consumers
              run: |
                  cmake -S . -B build \
                    -DCMAKE_INSTALL_INCLUDEDIR=include/annotest-sdk \
                    -DCMAKE_INSTALL_LIBDIR=lib/annotest-sdk
                  cmake --build build --parallel 2
                  python3 tools/check_installation.py --build-dir build

            - name: Check reachable source branch coverage
              run: |
                  cmake -S . -B build/coverage -G Ninja \
                    -DBUILD_TESTS=ON -DBUILD_EXAMPLES=OFF -DCMAKE_BUILD_TYPE=Debug \
                    '-DCMAKE_CXX_FLAGS=--coverage -O0 -g' \
                    -DCMAKE_EXE_LINKER_FLAGS=--coverage
                  cmake --build build/coverage --parallel 2
                  find build/coverage -name '*.gcda' -delete
                  ctest --test-dir build/coverage --output-on-failure --parallel 2
                  mkdir -p build/coverage/gcov-json
                  cd build/coverage/gcov-json
                  find ../CMakeFiles/annotest.dir ../tests/CMakeFiles -name '*.gcno' \
                    -exec gcov --json-format -b -c {} + > gcov.log
                  cd ../../..
                  python3 tools/coverage_audit.py build/coverage/gcov-json \
                    --output build/coverage/reachable-source-coverage.json

    macos:
        runs-on: macos-15
        steps:
            - uses: actions/checkout@v6.0.3
            - name: Install native toolchain
              run: brew install gcc ninja cmake python
            - name: Build and test
              run: |
                  cmake -S . -B build -G Ninja -DCMAKE_CXX_COMPILER=g++-16 \
                    -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTS=ON -DBUILD_EXAMPLES=ON \
                    -DCMAKE_INSTALL_INCLUDEDIR=include/annotest-sdk \
                    -DCMAKE_INSTALL_LIBDIR=lib/annotest-sdk
                  cmake --build build --parallel 2
                  ctest --test-dir build --output-on-failure --parallel 2
                  python3 tools/check_installation.py --build-dir build

    windows:
        runs-on: windows-2025
        defaults:
            run:
                shell: msys2 {0}
        steps:
            - uses: actions/checkout@v6.0.3
            - uses: msys2/setup-msys2@v2
              with:
                  msystem: UCRT64
                  update: true
                  install: >-
                      git
                      mingw-w64-ucrt-x86_64-gcc
                      mingw-w64-ucrt-x86_64-cmake
                      mingw-w64-ucrt-x86_64-ninja
                      mingw-w64-ucrt-x86_64-python
            - name: Build and test native Windows executables
              run: |
                  cmake -S . -B build -G Ninja -DCMAKE_CXX_COMPILER=g++ \
                    -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTS=ON -DBUILD_EXAMPLES=ON \
                    -DCMAKE_INSTALL_INCLUDEDIR=include/annotest-sdk \
                    -DCMAKE_INSTALL_LIBDIR=lib/annotest-sdk
                  cmake --build build --parallel 2
                  ctest --test-dir build --output-on-failure --parallel 2
                  python tools/check_installation.py --build-dir build
