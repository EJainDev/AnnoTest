name: Build
on:
    push:
        branches: [main]
    pull_request:
        branches: [main]

    workflow_call:
        inputs:
            package:
                description: Build native release archives after validation
                type: boolean
                default: false

permissions:
    contents: read

jobs:
    build-and-test:
        timeout-minutes: 45
        runs-on: ubuntu-24.04
        container:
            image: gcc@sha256:47c649664b62db94d186b16936e203bb07ab1d10a0ef860cee198e594f636757
        steps:
            - name: Install CMake
              run: |
                  apt update
                  apt install -y wget tar ninja-build python3

                  wget https://github.com/Kitware/CMake/releases/download/v4.3.3/cmake-4.3.3-linux-x86_64.tar.gz

                  tar -xzf cmake-4.3.3-linux-x86_64.tar.gz -C /opt

                  ln -s /opt/cmake-4.3.3-linux-x86_64/bin/* /usr/local/bin/

            - name: Checkout Project
              uses: actions/checkout@v6.0.3

            - name: Build and test
              run: |
                  cmake -S . -B build -G Ninja -DCMAKE_CXX_COMPILER=g++ \
                    -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTS=ON -DBUILD_EXAMPLES=ON
                  cmake --build build --parallel 2
                  ctest --test-dir build --output-on-failure --no-tests=error --parallel 2

            - name: Verify installation and FetchContent consumers
              run: |
                  cmake -S . -B build \
                    -DCMAKE_INSTALL_INCLUDEDIR=include/annotest-sdk \
                    -DCMAKE_INSTALL_LIBDIR=lib/annotest-sdk
                  cmake --build build --parallel 2
                  python3 tools/check_installation.py --build-dir build

            - name: Check reachable source branch coverage
              run: |
                  cmake -S . -B build/coverage -G Ninja \
                    -DBUILD_TESTS=ON -DBUILD_EXAMPLES=OFF -DCMAKE_BUILD_TYPE=Debug \
                    '-DCMAKE_CXX_FLAGS=--coverage -O0 -g' \
                    -DCMAKE_EXE_LINKER_FLAGS=--coverage
                  cmake --build build/coverage --parallel 2
                  find build/coverage -name '*.gcda' -delete
                  ctest --test-dir build/coverage --output-on-failure --no-tests=error --parallel 2
                  python3 tools/collect_coverage.py build/coverage build/coverage/gcov-json
                  python3 tools/coverage_audit.py build/coverage/gcov-json \
                    --output build/coverage/reachable-source-coverage.json

            - name: Package Linux library
              if: inputs.package
              run: python3 tools/package_release.py --build-dir build --tag "$GITHUB_REF_NAME" --platform linux-x86_64
            - uses: actions/upload-artifact@v4
              if: inputs.package
              with:
                  name: package-linux-x86_64
                  path: dist/*
                  if-no-files-found: error

    native:
        timeout-minutes: 45
        strategy:
            fail-fast: false
            matrix:
                include:
                    - os: macos-15
                      platform: macos-arm64
                      compiler: g++-16
                      shell: bash
                      python: python3
                    - os: macos-15-intel
                      platform: macos-x86_64
                      compiler: g++-16
                      shell: bash
                      python: python3
                    - os: windows-2025
                      platform: windows-x86_64
                      compiler: g++
                      shell: msys2 {0}
                      python: python
        runs-on: ${{ matrix.os }}
        defaults:
            run:
                shell: ${{ matrix.shell }}
        steps:
            - uses: actions/checkout@v6.0.3
            - name: Install macOS toolchain
              if: runner.os == 'macOS'
              run: brew install gcc ninja cmake python
            - name: Install Windows toolchain
              if: runner.os == 'Windows'
              uses: msys2/setup-msys2@v2
              with:
                  msystem: UCRT64
                  update: true
                  install: >-
                      git
                      mingw-w64-ucrt-x86_64-gcc
                      mingw-w64-ucrt-x86_64-cmake
                      mingw-w64-ucrt-x86_64-ninja
                      mingw-w64-ucrt-x86_64-python
            - name: Build and test native executables
              run: |
                  cmake -S . -B build -G Ninja -DCMAKE_CXX_COMPILER=${{ matrix.compiler }} \
                    -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTS=ON -DBUILD_EXAMPLES=ON \
                    -DCMAKE_INSTALL_INCLUDEDIR=include/annotest-sdk \
                    -DCMAKE_INSTALL_LIBDIR=lib/annotest-sdk
                  cmake --build build --parallel 2
                  ctest --test-dir build --output-on-failure --no-tests=error --parallel 2
                  ${{ matrix.python }} tools/check_installation.py --build-dir build
            - name: Package native library
              if: inputs.package
              run: ${{ matrix.python }} tools/package_release.py --build-dir build --tag "$GITHUB_REF_NAME" --platform ${{ matrix.platform }}
            - uses: actions/upload-artifact@v4
              if: inputs.package
              with:
                  name: package-${{ matrix.platform }}
                  path: dist/*
                  if-no-files-found: error

    docs:
        runs-on: ubuntu-24.04
        timeout-minutes: 10
        steps:
            - uses: actions/checkout@v6.0.3
            - uses: actions/setup-python@v6
              with:
                  python-version: '3.13'
            - name: Build documentation with strict diagnostics
              run: |
                  python -m pip install -r docs/requirements.txt
                  python -m sphinx -n -W --keep-going -b html docs/source build/docs
