name: Release

on:
    push:
        tags: ["v*"]

permissions:
    contents: read

jobs:
    build:
        uses: ./.github/workflows/build_and_test.yml
        with:
            package: true

    publish:
        needs: build
        runs-on: ubuntu-24.04
        timeout-minutes: 10
        permissions:
            contents: write
        steps:
            - uses: actions/download-artifact@v4
              with:
                  pattern: package-*
                  path: dist
                  merge-multiple: true
            - name: Verify the complete release artifact set
              run: |
                  test -f "dist/annotest-${GITHUB_REF_NAME}-linux-x86_64.tar.gz"
                  test -f "dist/annotest-${GITHUB_REF_NAME}-macos-arm64.tar.gz"
                  test -f "dist/annotest-${GITHUB_REF_NAME}-macos-x86_64.tar.gz"
                  test -f "dist/annotest-${GITHUB_REF_NAME}-windows-x86_64.zip"
            - name: Publish validated packages together
              uses: softprops/action-gh-release@v2
              with:
                  files: dist/*
                  fail_on_unmatched_files: true
